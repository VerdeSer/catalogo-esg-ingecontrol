<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Servicios ESG — Ingecontrol</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --verde: #1B6B45;
    --verde-claro: #E8F4EE;
    --verde-medio: #2D8A5A;
    --verde-oscuro: #0F3D26;
    --gris: #F5F4F0;
    --gris-borde: #E2E0D8;
    --gris-texto: #6B6860;
    --negro: #1A1917;
    --blanco: #FAFAF8;
    --ambar: #B86E00;
    --ambar-bg: #FFF3DE;
    --azul: #1A4A7A;
    --azul-bg: #E8EFF8;
    --coral: #8B3520;
    --coral-bg: #FAECE7;
    --purpura: #4A3A9E;
    --purpura-bg: #EEEDFE;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--blanco);
    color: var(--negro);
    min-height: 100vh;
  }

  header {
    background: var(--verde-oscuro);
    padding: 2rem 2.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  header .logo-area h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  header .logo-area p {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 300;
  }

  .badge-header {
    background: var(--verde-medio);
    color: #fff;
    font-size: 0.72rem;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
    align-self: center;
  }

  .controles {
    background: var(--gris);
    border-bottom: 1px solid var(--gris-borde);
    padding: 1.25rem 2.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .controles input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 9px 14px;
    border: 1px solid var(--gris-borde);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    background: #fff;
    color: var(--negro);
    outline: none;
    transition: border-color 0.15s;
  }
  .controles input[type="text"]:focus { border-color: var(--verde-medio); }
  .controles input[type="text"]::placeholder { color: #aaa; }

  .controles select {
    padding: 9px 14px;
    border: 1px solid var(--gris-borde);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    background: #fff;
    color: var(--negro);
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .controles select:focus { border-color: var(--verde-medio); }

  .contador {
    padding: 0.75rem 2.5rem 0;
    font-size: 0.8rem;
    color: var(--gris-texto);
    font-weight: 300;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    padding: 1rem 2.5rem 3rem;
  }

  .tarjeta {
    background: #fff;
    border: 1px solid var(--gris-borde);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: box-shadow 0.18s, border-color 0.18s, transform 0.18s;
  }
  .tarjeta:hover {
    border-color: var(--verde-medio);
    box-shadow: 0 4px 20px rgba(27,107,69,0.1);
    transform: translateY(-2px);
  }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; }

  .badge {
    font-size: 0.7rem;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .badge-ambiental { background: var(--verde-claro); color: var(--verde); }
  .badge-gobernanza { background: var(--azul-bg); color: var(--azul); }
  .badge-social { background: var(--ambar-bg); color: var(--ambar); }
  .badge-estrategia { background: var(--purpura-bg); color: var(--purpura); }
  .badge-ejecucion { background: var(--coral-bg); color: var(--coral); }
  .badge-evidencia { background: #F1EFE8; color: #5F5E5A; }

  .macro {
    font-size: 0.72rem;
    color: var(--gris-texto);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 300;
  }

  .nombre {
    font-size: 1rem;
    font-weight: 600;
    color: var(--negro);
    line-height: 1.3;
    margin-top: 2px;
  }

  .descripcion {
    font-size: 0.83rem;
    color: var(--gris-texto);
    line-height: 1.6;
  }

  .pregunta-box {
    background: var(--verde-claro);
    border-left: 2px solid var(--verde-medio);
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    margin-top: auto;
  }
  .pregunta-label {
    font-size: 0.65rem;
    color: var(--verde);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .pregunta-texto {
    font-size: 0.82rem;
    color: var(--verde-oscuro);
    font-style: italic;
    line-height: 1.5;
  }

  .vacio {
    display: none;
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--gris-texto);
  }
  .vacio svg { opacity: 0.3; margin-bottom: 1rem; }
  .vacio p { font-size: 0.9rem; }

  footer {
    background: var(--gris);
    border-top: 1px solid var(--gris-borde);
    padding: 1.25rem 2.5rem;
    font-size: 0.75rem;
    color: var(--gris-texto);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  @media (max-width: 600px) {
    header, .controles, .contador, .grid, footer { padding-left: 1rem; padding-right: 1rem; }
    header .logo-area h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <h1>Catálogo ESG</h1>
    <p>Portafolio de servicios sostenibles · Ingecontrol</p>
  </div>
  <span class="badge-header">Uso interno — equipo comercial</span>
</header>

<div class="controles">
  <input type="text" id="buscar" placeholder="🔍  Busca por palabra clave, cliente, tema..." oninput="filtrar()">
  <select id="esg" onchange="filtrar()">
    <option value="">Todas las dimensiones</option>
    <option value="Gobernanza">Gobernanza</option>
    <option value="Ambiental">Ambiental</option>
    <option value="Social">Social</option>
  </select>
  <select id="fase" onchange="filtrar()">
    <option value="">Todas las fases</option>
    <option value="Estrategia">Estrategia</option>
    <option value="Ejecución">Ejecución</option>
    <option value="Evidencia">Evidencia y verificación</option>
  </select>
</div>

<p class="contador" id="contador"></p>

<div class="grid" id="grid">
  <div class="vacio" id="vacio">
    <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <p>No se encontraron servicios con esos filtros.<br>Intenta con otras palabras clave.</p>
  </div>
</div>

<footer>
  <span>Ingecontrol · Línea de negocio sostenible</span>
  <span id="footer-count"></span>
</footer>

function badgeEsg(esg){
  const m = {Gobernanza:'badge-gobernanza',Ambiental:'badge-ambiental',Social:'badge-social'};
  return `<span class="badge ${m[esg]||''}">${esg}</span>`;
}
function badgeFase(fase){
  const m = {'Estrategia':'badge-estrategia','Ejecución':'badge-ejecucion','Evidencia':'badge-evidencia'};
  const label = fase==='Evidencia'?'Evidencia y verificación':fase;
  return `<span class="badge ${m[fase]||''}">${label}</span>`;
}

function renderizar(lista){
  const grid = document.getElementById('grid');
  const vacio = document.getElementById('vacio');
  const contador = document.getElementById('contador');
  const footerCount = document.getElementById('footer-count');

  const tarjetas = grid.querySelectorAll('.tarjeta');
  tarjetas.forEach(t => t.remove());
  vacio.style.display = 'none';

  if(lista.length === 0){
    vacio.style.display = 'block';
    contador.textContent = '';
    footerCount.textContent = '';
    return;
  }

  contador.textContent = `${lista.length} servicio${lista.length!==1?'s':''} encontrado${lista.length!==1?'s':''}`;
  footerCount.textContent = `${lista.length} de ${servicios.length} servicios`;

  lista.forEach(s => {
    const div = document.createElement('div');
    div.className = 'tarjeta';
    div.innerHTML = `
      <div class="badges">${badgeEsg(s.esg)}${badgeFase(s.fase)}</div>
      <div>
        <p class="macro">${s.macro}</p>
        <p class="nombre">${s.nombre}</p>
      </div>
      <p class="descripcion">${s.desc}</p>
      <div class="pregunta-box">
        <p class="pregunta-label">Pregunta de negocio del cliente</p>
        <p class="pregunta-texto">${s.pregunta}</p>
      </div>
    `;
    grid.appendChild(div);
  });
}

function filtrar(){
  const txt = document.getElementById('buscar').value.toLowerCase().trim();
  const esg = document.getElementById('esg').value;
  const fase = document.getElementById('fase').value;
  const resultado = servicios.filter(s => {
    const hayTexto = !txt || (s.nombre+' '+s.desc+' '+s.pregunta+' '+s.kw+' '+s.macro).toLowerCase().includes(txt);
    const hayEsg = !esg || s.esg === esg;
    const hayFase = !fase || s.fase === fase || (fase === 'Evidencia' && s.fase === 'Evidencia');
    return hayTexto && hayEsg && hayFase;
  });
  renderizar(resultado);
}

renderizar(servicios);
